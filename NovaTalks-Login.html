  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"uk\"><head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Увійти до NovaTalks<\u002Ftitle>\n  <style>/* Compiled from styles.scss — Vue 2 / Options API / no CSS frameworks\n   In a Vue 2 project these rules live in <style lang=\"scss\"> blocks\n   per component (Login.vue, ForgotPassword.vue, LinkSent.vue) with\n   the variables below shared via @use 'styles/variables' */\n\n/* ===== Variables (SCSS) =====================================\n$color-bg:          #f7f8fa;\n$color-card:        #ffffff;\n$color-border:      #e6e8ee;\n$color-text:        #15171c;\n$color-text-muted:  #6b7280;\n$color-placeholder: #c9cdd6;\n$color-primary:     #1e96fb;\n$color-primary-hover:#0d86ec;\n$color-primary-disabled:#bcdffd;\n$color-info-bg:     #f3f5f9;\n$color-info-icon:   #9aa3b2;\n$color-link:        #15171c;\n\n$radius-card:  14px;\n$radius-input: 10px;\n$radius-btn:   10px;\n\n$shadow-card: 0 1px 2px rgba(16, 24, 40, 0.04);\n============================================================ */\n\n* { box-sizing: border-box; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  height: 100%;\n  background: #f7f8fa;\n  color: #15171c;\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Helvetica Neue\",\n               Helvetica, Arial, sans-serif;\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n#app {\n  min-height: 100vh;\n  display: flex;\n  align-items: flex-start;\n  justify-content: center;\n  padding: 88px 24px 48px;\n}\n\n/* ===== Auth screen shell ===== */\n.auth {\n  width: 100%;\n  max-width: 560px;\n  display: flex;\n  flex-direction: column;\n  align-items: stretch;\n}\n\n.auth__title {\n  font-size: 40px;\n  font-weight: 600;\n  letter-spacing: -0.01em;\n  line-height: 1.15;\n  text-align: center;\n  margin: 0 0 40px;\n  color: #15171c;\n}\n.auth__title-accent {\n  font-weight: 700;\n}\n\n.auth__card {\n  background: #ffffff;\n  border: 1px solid #e6e8ee;\n  border-radius: 14px;\n  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);\n  padding: 28px 28px 24px;\n}\n\n.auth__lead {\n  margin: 0 0 22px;\n  color: #15171c;\n  font-size: 15px;\n  line-height: 1.5;\n}\n\n/* ===== Form ===== */\n.field { margin-bottom: 18px; }\n.field:last-of-type { margin-bottom: 0; }\n\n.field__label {\n  display: block;\n  font-size: 13.5px;\n  font-weight: 500;\n  color: #15171c;\n  margin-bottom: 8px;\n}\n\n.field__control {\n  position: relative;\n  display: flex;\n  align-items: center;\n}\n\n.input {\n  width: 100%;\n  height: 44px;\n  padding: 0 14px;\n  font: inherit;\n  font-size: 14.5px;\n  color: #15171c;\n  background: #ffffff;\n  border: 1px solid #e6e8ee;\n  border-radius: 10px;\n  outline: none;\n  transition: border-color .15s ease, box-shadow .15s ease;\n}\n.input::placeholder { color: #c9cdd6; }\n.input:hover { border-color: #d6dae2; }\n.input:focus {\n  border-color: #1e96fb;\n  box-shadow: 0 0 0 3px rgba(30, 150, 251, 0.2);\n}\n\n.input--with-icon { padding-right: 44px; }\n\n/* Error state — used on the \"user not found\" message in Forgot password */\n.input--error,\n.input--error:hover {\n  border-color: #e3294a;\n}\n.input--error:focus {\n  border-color: #e3294a;\n  box-shadow: 0 0 0 3px rgba(227, 41, 74, 0.18);\n}\n.field__error {\n  margin: 8px 2px 0;\n  color: #e3294a;\n  font-size: 13px;\n  line-height: 1.4;\n}\n\n.field__icon-btn {\n  position: absolute;\n  right: 6px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 32px;\n  height: 32px;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  background: transparent;\n  border: 0;\n  color: #9aa3b2;\n  border-radius: 8px;\n  cursor: pointer;\n  padding: 0;\n}\n.field__icon-btn:hover { color: #6b7280; background: #f3f5f9; }\n\n/* Select wrapper using a transparent <select> + custom chevron */\n.select {\n  position: relative;\n  width: 100%;\n}\n.select select {\n  appearance: none;\n  -webkit-appearance: none;\n  width: 100%;\n  height: 44px;\n  padding: 0 38px 0 14px;\n  font: inherit;\n  font-size: 14.5px;\n  color: #15171c;\n  background: #ffffff;\n  border: 1px solid #e6e8ee;\n  border-radius: 10px;\n  outline: none;\n  cursor: pointer;\n  transition: border-color .15s ease, box-shadow .15s ease;\n}\n.select select:hover { border-color: #d6dae2; }\n.select select:focus {\n  border-color: #1e96fb;\n  box-shadow: 0 0 0 3px rgba(30, 150, 251, 0.2);\n}\n.select__chevron {\n  position: absolute;\n  right: 14px;\n  top: 50%;\n  transform: translateY(-50%);\n  width: 10px;\n  height: 10px;\n  pointer-events: none;\n  color: #9aa3b2;\n}\n\n/* ===== Buttons ===== */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 100%;\n  height: 46px;\n  font: inherit;\n  font-size: 15px;\n  font-weight: 600;\n  border-radius: 10px;\n  border: 0;\n  cursor: pointer;\n  transition: background-color .15s ease, transform .05s ease;\n  padding: 0 16px;\n}\n.btn:active { transform: translateY(1px); }\n\n.btn--primary {\n  background: #1e96fb;\n  color: #ffffff;\n}\n.btn--primary:hover { background: #0d86ec; }\n.btn--primary:disabled,\n.btn--primary[aria-disabled=\"true\"] {\n  background: #bcdffd;\n  color: #ffffff;\n  cursor: not-allowed;\n}\n\n/* ===== Helper links / rows under primary action ===== */\n.auth__actions { margin-top: 22px; }\n\n.linkbtn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  width: 100%;\n  margin-top: 14px;\n  background: transparent;\n  border: 0;\n  cursor: pointer;\n  font: inherit;\n  font-size: 14px;\n  color: #15171c;\n  padding: 8px 0;\n  border-radius: 8px;\n}\n.linkbtn:hover { color: #000; }\n.linkbtn--muted { color: #6b7280; }\n.linkbtn--muted:hover { color: #15171c; }\n\n/* ===== Link-sent screen ===== */\n.sent {\n  text-align: center;\n  padding: 8px 4px 0;\n}\n.sent__icon {\n  width: 56px;\n  height: 56px;\n  margin: 0 auto 18px;\n  border-radius: 50%;\n  background: #e3f2fe;\n  color: #1e96fb;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.sent__title {\n  font-size: 20px;\n  font-weight: 700;\n  margin: 0 0 10px;\n  color: #15171c;\n}\n.sent__desc {\n  font-size: 14.5px;\n  line-height: 1.55;\n  color: #6b7280;\n  margin: 0 auto 22px;\n  max-width: 440px;\n}\n.sent__desc b {\n  color: #15171c;\n  font-weight: 600;\n}\n\n.note {\n  display: flex;\n  align-items: flex-start;\n  gap: 10px;\n  background: #f3f5f9;\n  border-radius: 10px;\n  padding: 14px 14px;\n  margin-bottom: 18px;\n  text-align: left;\n  font-size: 14px;\n  line-height: 1.5;\n  color: #15171c;\n}\n.note__icon {\n  flex: 0 0 auto;\n  color: #9aa3b2;\n  margin-top: 1px;\n}\n\n/* ===== Page-level transition ===== */\n.fade-enter-active, .fade-leave-active {\n  transition: opacity .22s ease, transform .22s ease;\n}\n.fade-enter-from, .fade-enter {\n  opacity: 0;\n  transform: translateY(6px);\n}\n.fade-leave-to {\n  opacity: 0;\n  transform: translateY(-4px);\n}\n\n/* ===== Small screens ===== */\n@media (max-width: 520px) {\n  #app { padding-top: 48px; }\n  .auth__title { font-size: 28px; margin-bottom: 28px; }\n  .auth__card { padding: 22px 18px; }\n}\n\n\n/* ===== Demo simulation panel (НЕ частина клієнтського UI) ===== */\n.sim-panel {\n  position: fixed;\n  right: 20px;\n  bottom: 20px;\n  z-index: 9000;\n  background: #ffffff;\n  border: 1px solid #e6e8ee;\n  border-radius: 12px;\n  box-shadow: 0 6px 20px rgba(16, 24, 40, 0.08);\n  padding: 12px 14px 12px 14px;\n  font-family: -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Helvetica Neue\",\n               Helvetica, Arial, sans-serif;\n  min-width: 220px;\n  user-select: none;\n}\n.sim-panel__title {\n  font-size: 11px;\n  letter-spacing: 0.08em;\n  text-transform: uppercase;\n  color: #9aa3b2;\n  margin-bottom: 8px;\n  font-weight: 600;\n}\n.sim-toggle {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  cursor: pointer;\n  font-size: 13.5px;\n  color: #15171c;\n}\n.sim-toggle input {\n  position: absolute;\n  opacity: 0;\n  pointer-events: none;\n}\n.sim-toggle__track {\n  position: relative;\n  width: 34px;\n  height: 20px;\n  background: #d6d9e0;\n  border-radius: 999px;\n  transition: background 160ms ease;\n  flex-shrink: 0;\n}\n.sim-toggle__thumb {\n  position: absolute;\n  top: 2px;\n  left: 2px;\n  width: 16px;\n  height: 16px;\n  background: #ffffff;\n  border-radius: 50%;\n  box-shadow: 0 1px 2px rgba(16, 24, 40, 0.2);\n  transition: transform 160ms ease;\n}\n.sim-toggle input:checked + .sim-toggle__track {\n  background: #1e96fb;\n}\n.sim-toggle input:checked + .sim-toggle__track .sim-toggle__thumb {\n  transform: translateX(14px);\n}\n.sim-toggle input:focus-visible + .sim-toggle__track {\n  outline: 2px solid #1e96fb;\n  outline-offset: 2px;\n}\n.sim-toggle__label {\n  line-height: 1.25;\n}\n\n/* ===== Top toast (білий текст на чорному фоні, зверху по центру) ===== */\n.toast-root {\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n  display: flex;\n  justify-content: center;\n  pointer-events: none;\n  z-index: 10000;\n}\n.toast {\n  margin-top: 24px;\n  max-width: min(560px, calc(100vw - 32px));\n  background: #0b0c0f;\n  color: #ffffff;\n  padding: 14px 20px;\n  border-radius: 10px;\n  font-size: 14.5px;\n  line-height: 1.4;\n  font-weight: 500;\n  letter-spacing: 0.01em;\n  text-align: center;\n  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);\n  opacity: 0;\n  transform: translateY(-12px);\n  transition: opacity 220ms ease, transform 220ms ease;\n  pointer-events: auto;\n}\n.toast--in {\n  opacity: 1;\n  transform: translateY(0);\n}\n.toast--out {\n  opacity: 0;\n  transform: translateY(-12px);\n}\n\n@media (max-width: 520px) {\n  .sim-panel {\n    right: 12px;\n    bottom: 12px;\n    min-width: 0;\n  }\n}\n<\u002Fstyle>\n  \n<\u002Fhead>\n<body>\n  <div id=\"app\" data-screen-label=\"Auth\"><\u002Fdiv>\n\n  <!-- Панель симуляції (поза інтерфейсом клієнта, тільки для демо) -->\n  <aside class=\"sim-panel\" aria-label=\"Панель симуляції\">\n    <div class=\"sim-panel__title\">Симуляція<\u002Fdiv>\n    <label class=\"sim-toggle\">\n      <input type=\"checkbox\" id=\"sim-blocked\">\n      <span class=\"sim-toggle__track\"><span class=\"sim-toggle__thumb\"><\u002Fspan><\u002Fspan>\n      <span class=\"sim-toggle__label\">Акаунт заблоковано<\u002Fspan>\n    <\u002Flabel>\n  <\u002Faside>\n\n  <!-- Контейнер для топ-нотифікацій -->\n  <div id=\"toast-root\" class=\"toast-root\" aria-live=\"polite\" aria-atomic=\"true\"><\u002Fdiv>\n\n  <!-- Vue 2 (Options API). No TypeScript. No CSS frameworks. -->\n  <script src=\"2f930c0a-cc96-4b53-8476-4ba580dc06fd\"><\u002Fscript>\n\n  <script src=\"7d14b1c8-9f71-44c6-b7c6-9a1a5b647ede\"><\u002Fscript>\n  <script src=\"9760d26f-7cd3-49c1-bafb-8dfb3c949aa9\"><\u002Fscript>\n  <script src=\"d3d48f58-ee95-4036-a517-8dbefbe70edc\"><\u002Fscript>\n  <script src=\"fa988c5a-9670-456e-a071-2cebc4c1430b\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
